# Workspace: Shopfront.
#
# The second example, and the architecture's own regression test. Same runtime,
# same engine, same expression language as Demo Bank — only the config differs.
#
# No credential here either — the demo cluster is trust-authenticated on
# loopback. Shopfront has no database service of its own: `pnpm demo:db` creates
# both databases in one cluster, so start that first, then `pnpm demo:shop`.

name: Shopfront
baseUrl: ${SHOPFRONT_BASE_URL:-http://127.0.0.1:7423}
resetUrl: ${SHOPFRONT_BASE_URL:-http://127.0.0.1:7423}/debug/reset

database:
  connectionString: ${SHOPFRONT_DATABASE_URL:-postgresql://postgres@127.0.0.1:7432/shopfront}

scenariosDir: scenarios

identities:
  - id: dana
    header: { name: authorization, value: "Bearer cus_dana" }
  - id: eli
    header: { name: authorization, value: "Bearer cus_eli" }

ignoreColumns:
  - updated_at

baselineWindowMs: 400
