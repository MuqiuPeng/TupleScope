# Install, build, and run every test — including the ones that need a database.
#
# There is no `services: postgres:` block here and there should not be. The
# example brings its own PostgreSQL as a platform binary, and it initialises the
# cluster with `wal_level = logical`. A stock service container is `replica`,
# which makes the 22 `wal`-engine conformance cases skip — quietly, with the
# suite still green. Starting the example's own database is what makes the run
# mean what it says.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Node 20 cannot expand the `src/**/*.test.ts` globs the 13 test
        # scripts pass to `node --test` — it takes them as literal paths, finds
        # nothing, and exits 1. Glob support arrived in the 22 line, and 20
        # reached end of life in April 2026.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the default in CI; naming it makes the failure
      # legible when package.json and the lockfile drift apart.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The bin must exist before the build, or it was never linked. This is the
      # exact defect that shipped: pnpm skips a bin whose target is absent at
      # install time, without a warning, and a later build does not re-link.
      - name: the CLI is on PATH
        run: |
          test -x node_modules/.bin/tuplescope
          test -x node_modules/.bin/tuplescope-mcp
          node_modules/.bin/tuplescope --version

      - name: start the example database
        run: |
          nohup pnpm demo:db > "$RUNNER_TEMP/db.log" 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'postgres ready' "$RUNNER_TEMP/db.log" && exit 0
            sleep 2
          done
          echo "database did not come up:"; cat "$RUNNER_TEMP/db.log"; exit 1

      # From inside the example, which is where `pg` is a dependency. At the
      # repository root it does not resolve.
      - name: it is the server the wal engine needs
        working-directory: examples/demo-bank
        run: |
          level=$(node -e "
            const {Client} = require('pg');
            const c = new Client('postgresql://postgres@127.0.0.1:7432/postgres');
            c.connect()
             .then(() => c.query('show wal_level'))
             .then(r => { console.log(r.rows[0].wal_level); return c.end(); });
          ")
          echo "wal_level = $level"
          test "$level" = logical

      # A floor on the number of tests, not a count of skips.
      #
      # Three things this step got wrong before, each measured:
      #
      # `node --test` prints `ℹ skipped N` under the spec reporter and TAP's
      # `# skipped N` otherwise, and which one you get depends on the Node line
      # and on whether stdout is a TTY. An ℹ-only pattern matched nothing here.
      #
      # `grep -c` exits 1 on no match, and under Actions' default `bash -e` a
      # failing assignment kills the step before it prints anything — so the
      # guard against a silent failure failed silently.
      #
      # And counting skips does not catch the case it was written for. When a
      # whole suite bows out — the database unreachable, so `describe` never
      # runs — the totals read `tests 0 ... skipped 0`. Green, having run
      # nothing. The total is what moves, so the total is what is asserted.
      #
      # The floor is deliberately below today's 593: a real regression halves
      # it, and this should not need editing every time a test is added. The
      # skips are printed rather than asserted, because the counts differ per
      # platform (Linux skips 12 macOS Keychain tests) and this repository can
      # only measure one of them.
      - name: test
        env:
          TUPLESCOPE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:7432/postgres
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"

          sum() { sed -nE "s/.*(ℹ|#) $1 ([0-9]+).*/\\2/p" "$RUNNER_TEMP/test.log" \
                  | awk '{s+=$1} END {print s+0}'; }
          total=$(sum tests); passed=$(sum pass); failed=$(sum fail); skipped=$(sum skipped)
          echo "total=$total pass=$passed fail=$failed skipped=$skipped"

          if [ "$skipped" -gt 0 ]; then
            echo "skipped tests (not a failure; here so they are never invisible):"
            grep -E '(SKIP|﹣)' "$RUNNER_TEMP/test.log" | head -40
          fi

          test "$total" -ge 560
          test "$failed" -eq 0

      - name: the example runs, end to end
        run: |
          nohup pnpm demo:api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 45); do
            curl -sf http://127.0.0.1:7421/health >/dev/null && break
            sleep 2
          done
          cd examples/demo-bank
          ../../node_modules/.bin/tuplescope check
          ../../node_modules/.bin/tuplescope run --no-save
