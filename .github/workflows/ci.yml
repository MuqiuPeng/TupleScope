# Install, build, and run every test — including the ones that need a database.
#
# There is no `services: postgres:` block here and there should not be. The
# example brings its own PostgreSQL as a platform binary, and it initialises the
# cluster with `wal_level = logical`. A stock service container is `replica`,
# which makes the 22 `wal`-engine conformance cases skip — quietly, with the
# suite still green. Starting the example's own database is what makes the run
# mean what it says.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Node 20 cannot expand the `src/**/*.test.ts` globs the 13 test
        # scripts pass to `node --test` — it takes them as literal paths, finds
        # nothing, and exits 1. Glob support arrived in the 22 line, and 20
        # reached end of life in April 2026.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the default in CI; naming it makes the failure
      # legible when package.json and the lockfile drift apart.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The bin must exist before the build, or it was never linked. This is the
      # exact defect that shipped: pnpm skips a bin whose target is absent at
      # install time, without a warning, and a later build does not re-link.
      - name: the CLI is on PATH
        run: |
          test -x node_modules/.bin/tuplescope
          test -x node_modules/.bin/tuplescope-mcp
          node_modules/.bin/tuplescope --version

      - name: start the test database
        run: |
          nohup pnpm testdb > "$RUNNER_TEMP/db.log" 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'postgres ready' "$RUNNER_TEMP/db.log" && exit 0
            sleep 2
          done
          echo "database did not come up:"; cat "$RUNNER_TEMP/db.log"; exit 1

      # From inside a package that depends on `pg`. At the repository root it
      # does not resolve.
      - name: it is the server the wal engine needs
        working-directory: packages/db-postgres
        run: |
          level=$(node -e "
            const {Client} = require('pg');
            const c = new Client('postgresql://postgres@127.0.0.1:7432/postgres');
            c.connect()
             .then(() => c.query('show wal_level'))
             .then(r => { console.log(r.rows[0].wal_level); return c.end(); });
          ")
          echo "wal_level = $level"
          test "$level" = logical

      # A floor on the number of tests, not a count of skips.
      #
      # Three things this step got wrong before, each measured:
      #
      # `node --test` prints `ℹ skipped N` under the spec reporter and TAP's
      # `# skipped N` otherwise, and which one you get depends on the Node line
      # and on whether stdout is a TTY. An ℹ-only pattern matched nothing here.
      #
      # `grep -c` exits 1 on no match, and under Actions' default `bash -e` a
      # failing assignment kills the step before it prints anything — so the
      # guard against a silent failure failed silently.
      #
      # And counting skips does not catch the case it was written for. When a
      # whole suite bows out — the database unreachable, so `describe` never
      # runs — the totals read `tests 0 ... skipped 0`. Green, having run
      # nothing. The total is what moves, so the total is what is asserted.
      #
      # The floor is deliberately below today's 593: a real regression halves
      # it, and this should not need editing every time a test is added. The
      # skips are printed rather than asserted, because the counts differ per
      # platform (Linux skips 12 macOS Keychain tests) and this repository can
      # only measure one of them.
      - name: test
        env:
          TUPLESCOPE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:7432/postgres
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"

          sum() { sed -nE "s/.*(ℹ|#) $1 ([0-9]+).*/\\2/p" "$RUNNER_TEMP/test.log" \
                  | awk '{s+=$1} END {print s+0}'; }
          total=$(sum tests); passed=$(sum pass); failed=$(sum fail); skipped=$(sum skipped)
          echo "total=$total pass=$passed fail=$failed skipped=$skipped"

          if [ "$skipped" -gt 0 ]; then
            echo "skipped tests (not a failure; here so they are never invisible):"
            grep -E '(SKIP|﹣)' "$RUNNER_TEMP/test.log" | head -40
          fi

          test "$total" -ge 560
          test "$failed" -eq 0

      # The front page claims `pnpm demo` prints the diff at the top of it. A
      # claim about a command is worth exactly as much as a run of that command,
      # and a demo nobody runs rots into a lie faster than anything else here —
      # it is the one piece of this repository whose only job is to be someone's
      # first impression.
      #
      # It brings its own PostgreSQL on another port, so it does not touch the
      # one above. Roughly a second locally.
      - name: the demo on the front page still runs
        run: |
          set -o pipefail
          pnpm demo 2>&1 | tee "$RUNNER_TEMP/demo.log"
          grep -q 'outcome  clean' "$RUNNER_TEMP/demo.log"
          # The four tables the README's opening diff names. If the demo stops
          # showing one, the front page is describing something else.
          for table in payments refunds ledger_entries wallets; do
            grep -q "$table" "$RUNNER_TEMP/demo.log" || {
              echo "the demo no longer touches $table, which the README's diff shows"; exit 1; }
          done

  # Windows, without a database — because it measurably cannot have one.
  #
  # Not a matrix row on the job above: that job's steps are POSIX shell and its
  # whole point is a running PostgreSQL, and on Windows the embedded server does
  # not start. Measured on a real runner (windows-probe.yml, run 33634415097):
  # `initdb` succeeds — it re-executes itself with a restricted token — and then
  # `postgres.exe` refuses, because it has no such path of its own and a
  # GitHub-hosted runner is `runneradmin`, an administrator:
  #
  #   Execution of PostgreSQL by a user with administrative permissions is not
  #   permitted.
  #
  # So this leg runs everything that does not need a database and lets the rest
  # skip, which is exactly what the skip guards are for. Measured locally against
  # an unreachable database: 723 tests, 644 pass, 0 fail, 79 skipped.
  #
  # What it is here to protect is the credential backend. That code had never
  # run anywhere — its PowerShell shim did not compile, on any Windows machine,
  # ever (946ead1) — and nothing in CI would have said so. The same probe run
  # then proved the fix: a full round trip through the Credential Manager,
  # byte-exact including trailing whitespace.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # pnpm writes three shims here: a POSIX one for Git Bash, plus `.cmd` and
      # `.ps1`. `.cmd` is what a Windows shell resolves, so `.cmd` is what is
      # checked — running the POSIX one under `node` fails for reasons that have
      # nothing to do with linking, which cost this file one run to learn.
      - name: the CLI is on PATH
        shell: pwsh
        run: |
          & node_modules/.bin/tuplescope.cmd --version
          & node_modules/.bin/tuplescope-mcp.cmd --version

      # No database is started and none is configured, so every suite that needs
      # one skips itself. The floor is what catches a suite bowing out silently:
      # when `describe` never runs, the totals read `tests 0 ... skipped 0`, which
      # is green having run nothing.
      - name: test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"

          sum() { sed -nE "s/.*(ℹ|#) $1 ([0-9]+).*/\2/p" "$RUNNER_TEMP/test.log" \
                  | awk '{s+=$1} END {print s+0}'; }
          total=$(sum tests); passed=$(sum pass); failed=$(sum fail); skipped=$(sum skipped)
          echo "total=$total pass=$passed fail=$failed skipped=$skipped"

          test "$failed" -eq 0
          test "$total" -ge 550
