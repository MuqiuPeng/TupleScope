<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TupleScope</title>
    <link rel="stylesheet" href="/styles.css?v=17" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>TupleScope</h1>
          <span class="tagline">Run the story. Inspect the evidence.</span>
        </div>
      </div>
      <div class="topbar-right">
        <!--
          Connectivity before the workspace chips. The chip row is a horizontal
          scroller that grows with the workspace name, and the two indicators
          must not be the things that scroll or wrap out of sight.
        -->
        <div class="reach-strip" id="reachStrip" role="group" aria-label="API and database connectivity"></div>
        <!--
          Written only when a state changes. The strip cannot be the live region
          itself: its timestamps tick every five seconds, and a region that
          repeats "checked 40s ago" into someone's ear is worse than none.
        -->
        <span class="reach-announce" id="reachAnnounce" aria-live="polite"></span>
        <div class="topbar-meta" id="workspaceMeta" aria-live="polite"></div>
      </div>
      <!--
        The reason and the remedy for one indicator, on its own line inside the
        topbar — so opening it grows the header instead of covering the column
        the reader is working in. Closed by `hidden`, which is why no rule in
        styles.css gives it a `display`.
      -->
      <div class="reach-detail" id="reachDetail" hidden></div>
    </header>

    <main class="layout">
      <aside class="col col-scenarios" aria-label="Scenario library">
        <div class="pane-heading">
          <div>
            <span class="eyebrow">Workspace</span>
            <h2>Scenarios</h2>
          </div>
          <span class="pane-count" id="scenarioCount"></span>
        </div>
        <div id="scenarios" class="scenario-list"></div>
      </aside>

      <section class="col col-steps">
        <div class="run-strip" id="runStrip">
          <span id="runSummary"></span>
        </div>
        <div id="requestWorkspace" class="request-workspace"></div>
      </section>

      <section class="col col-db">
        <div class="pane-heading evidence-heading">
          <div>
            <span class="eyebrow">Evidence</span>
            <h2>What changed</h2>
          </div>
          <span class="pane-count" id="diffSummary"></span>
        </div>
        <div id="story" class="story-panel"></div>
        <div id="evidenceTabs" class="evidence-tabs"></div>
        <div id="diff" class="evidence-panel">
          <div class="empty-state compact">
            <span class="empty-index">02</span>
            <h3>Then read the proof</h3>
            <p>Response, assertions, state transitions and database writes stay connected to the step that caused them.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="/api-error.js?v=1"></script>
    <script src="/runs.js?v=1"></script>
    <script src="/steps.js?v=1"></script>
    <script src="/verdict.js?v=1"></script>
    <script src="/chart.js?v=1"></script>
    <script src="/app.js?v=40"></script>
  </body>
</html>
